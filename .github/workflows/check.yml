name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Built-ins only: manifests, key handling, the skill, examples, and that the
      # docs name exactly the product's tools and networks.
      - run: node scripts/check.mjs
